plugins {
	id 'net.fabricmc.fabric-loom' version '1.17.17'
	id 'maven-publish'
}



version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}
repositories {
	mavenLocal()
}

dependencies {
	// Optional: block-tip integration, compile-only and never bundled. Resolved by the version
	// block-tip declares rather than a version written down here, because Gradle never clears
	// build/libs and a pinned version keeps compiling green against the jar an old build left
	// behind, long after the API it was written for has moved.
	def blockTipProperties = file("../block-tip/gradle.properties")
	if (blockTipProperties.exists()) {
		def blockTipVersion = new Properties().with {
			blockTipProperties.withInputStream { load(it) }
			getProperty("mod_version")
		}
		def blockTipJar = file("../block-tip/build/libs/block-tip-${blockTipVersion}.jar")
		if (!blockTipJar.exists()) {
			// Said plainly, because the alternative is javac reporting that BlockTipApi does not
			// exist: the integration below imports it outright, so the jar is only optional at
			// runtime. A clean, or a fresh clone, leaves this directory empty.
			throw new GradleException("block-tip ${blockTipVersion} is not built. Run `mc-build block-tip`" +
				" (or ./gradlew build in ../block-tip) first - this mod compiles against its API.")
		}
		compileOnly files(blockTipJar)
	}

	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	implementation(project(':pandorical'))
}

// Fabric tests these predicates against the loader's *normalized* game version,
// not Mojang's id: 26.3-snapshot-10 is compared as 26.3-alpha.10. So a floor of
// ">=26.3" is false on every 26.3 snapshot, and writing the obvious thing makes
// the mod refuse to load on the version it was built for. Derived from the pin
// rather than written into the manifest, so the two cannot drift apart.
def mcFloor = project.minecraft_version
	.replaceFirst(/-snapshot-/, '-alpha.')
	.replaceFirst(/-pre-/, '-pre.')
	.replaceFirst(/-rc-/, '-rc.')
// The trailing dash is load-bearing: "<26.4" would still admit 26.4's snapshots,
// because a prerelease sorts below its own release.
def mcParts = mcFloor.tokenize('.-')
def minecraftDependency = ">=${mcFloor} <${mcParts[0]}.${(mcParts[1] as int) + 1}-"
// The +26.3 build tag is ignored in comparison; the floor is the number.
def fabricApiFloor = ">=" + project.fabric_version.replaceFirst(/\+.*$/, '')

processResources {
	inputs.property "version", project.version
	inputs.property "minecraftDependency", minecraftDependency
	inputs.property "loaderVersion", project.loader_version
	inputs.property "fabricApiVersion", fabricApiFloor

	filesMatching("fabric.mod.json") {
		expand "version": project.version,
		       "minecraftDependency": minecraftDependency,
		       "loaderVersion": project.loader_version,
		       "fabricApiVersion": fabricApiFloor
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 25
}

java {
	withSourcesJar()
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	repositories {
	}
}
